
name: Crear clave permanente

on:
  workflow_dispatch:

jobs:
  crear-firma:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generar archivo de firma
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore distribuidora.jks \
            -storetype JKS \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Distribuidora, OU=Aplicacion, O=Distribuidora, L=Quito, ST=Pichincha, C=EC"

      - name: Convertir a Base64
        run: |
          base64 -w 0 distribuidora.jks > distribuidora-base64.txt

      - name: Guardar archivo de firma
        uses: actions/upload-artifact@v4
        with:
          name: clave-firma-distribuidora
          path: |
            distribuidora.jks
            distribuidora-base64.txt
          retention-days: 90
